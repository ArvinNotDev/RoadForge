name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core test dependencies
        run: python -m pip install "pytest>=8,<9" "numpy>=1.26,<3" "Pillow>=10,<13" "PyYAML>=6,<7" "opencv-python-headless>=4.9,<5"

      - name: Compile RoadForge modules
        run: python -m compileall -q roadforge datacollector

      - name: Run test suite
        run: python -m pytest -q
