name: Feature request
description: Propose a research, data-integrity, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or research need
      description: What limitation or use case should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected workflow or interface behavior.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: How should this feature be tested or scientifically evaluated?
